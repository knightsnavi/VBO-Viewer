<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- GitHub Pages cannot send headers, so the policy is delivered here. Scripts and
     styles only from this origin; images additionally from the three tile servers;
     video only from the local files the user picks (blob:). -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self';
  style-src 'self';
  img-src 'self' https://server.arcgisonline.com https://tile.openstreetmap.org https://*.basemaps.cartocdn.com;
  media-src blob:;
  connect-src 'self';
  object-src 'none';
  base-uri 'none';
  form-action 'none'">
<title>VBO Viewer</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <h1><span>VBO</span> Viewer</h1>
  <label class="btn">Open .vbo file<input id="file" type="file" accept=".vbo,.txt"></label>
  <button class="btn" id="sample">Load sample</button>
  <label class="btn" id="vidBtn">Load video<input id="vidFile" type="file" accept="video/*" multiple></label>
  <span class="seg" id="units"><button data-u="metric">km/h</button><button data-u="imperial">mph</button></span>
  <span id="vidName"></span>
  <span id="fileName">No file loaded — drop a .vbo anywhere</span>
</header>
<div id="drop">Drop your .vbo file</div>
<div class="notice" id="notice" hidden><span id="noticeText"></span><button class="btn" id="noticeX">Dismiss</button></div>

<main id="main">
  <div class="empty" id="empty">
    <b>Open a Racelogic VBOX <code>.vbo</code> log</b> to see the track map, speed &amp; G traces, and lap times.
  </div>
</main>

<script src="vendor/leaflet.js"></script>
<script src="vendor/chart.umd.js"></script>
<script src="app.js"></script>
</body>
</html>
